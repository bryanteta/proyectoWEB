<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Logotipo del Portal de Trabajo">
  <!--
    MOTIVO DEL PROYECTO: cuadrado (estructura) + círculo (acento).
    El cuadrado negro representa la oferta; el círculo bermellón,
    la persona que la ocupa. Se superponen a modo de sello.
  -->
  <rect x="4" y="4" width="30" height="30" fill="#191510"/>
  <circle cx="33" cy="33" r="11" fill="#cf3b1a"/>
  <rect x="12" y="12" width="14" height="14" fill="none" stroke="#f4efe3" stroke-width="1.6"/>
</svg>
